# claudence's own git hooks (work items: ~/.claude/docs/work/spec-gate/, docs/work/pii-scan/). The fleet installer
# (~/.claude/scripts/install_fleet_hooks.py) copies git-hooks/fleet-pre-commit-config.yaml, not this file.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: portable-filenames
        name: file names are ASCII with no spaces
        language: fail
        entry: "rename to ASCII letters, digits, . _ - only (no spaces):"
        files: '[^\x21-\x7e]'
        stages: [pre-commit]
      - id: decision-ids
        name: DECISIONS.md adds no duplicate id
        language: unsupported
        entry: python C:/Users/Michael/.claude/scripts/decision_ids.py
        files: '(^|/)docs/DECISIONS\.md$'
        stages: [pre-commit]
      - id: pii-scan
        name: public repos add no personal data (opt-in by a .pii-scan marker)
        language: unsupported
        entry: python C:/Users/Michael/.claude/scripts/pii_scan.py
        types: [text]
        exclude: ^docs/work/pii-scan/(reviews|evidence)/  # its own reviews quote the fake test fixtures
        stages: [pre-commit]
      - id: pii-scan-msg
        name: public repos add no personal data to the commit message or author
        language: unsupported
        entry: python C:/Users/Michael/.claude/scripts/pii_scan.py --commit-msg
        stages: [commit-msg]
      - id: spec-gate
        name: source commits cite a building or shipped work item (docs/work)
        language: unsupported
        entry: python C:/Users/Michael/.claude/scripts/spec_gate.py
        always_run: true
        stages: [commit-msg]
